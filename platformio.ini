; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 76800
upload_speed = 460800
lib_deps = 
	fastled/FastLED@^3.5.0
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	alanswx/ESPAsyncWiFiManager @ ^0.31
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	crankyoldgit/IRremoteESP8266@^2.8.5
build_flags =
	-Wno-misleading-indentation
	-Wno-deprecated-declarations

; Raspberry Pi Pico (RP2040) ports. No wireless on pico_base; picow adds
; HAS_WIFI via the build_flags so the network code (AsyncWebServer,
; ESPAsyncWiFiManager, WiFi.h, etc.) is compiled in.
[env:pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	fastled/FastLED@^3.5.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
build_flags = -D HAS_WIFI
lib_deps =
	fastled/FastLED@^3.5.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
