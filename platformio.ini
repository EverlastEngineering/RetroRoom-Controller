; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Single firmware target: Raspberry Pi Pico 2 W (RP2350A + on-board
; CYW43). All other environments ([env:pico_base], [env:picow],
; [env:pico_yd]) were removed 2026-09-22 at the user's request --
; "We no longer need to build for anything but the pico2w!" See
; git history and the todo/done/ drop-...-envs entry for the prior
; multi-env structure. Host-side unit tests still run via the
; [env:test_native] environment below.
;
; ESP8266 (NodeMCU v2) support was dropped earlier on
; session/merge-pico-json -- the legacy [env:nodemcuv2] block and
; its ESP-coupled libraries are intentionally gone.

; FastLED 3.10+ ships a complete RP2040 PIO backend at
; src/platforms/arm/rp2040/clockless_arm_rp2040.h. The backend is gated
; by FASTLED_RP2040_CLOCKLESS_PIO (=1, default) and
; FASTLED_RP2040_CLOCKLESS_M0_FALLBACK (=0, default; suppresses the
; legacy SysTick-using bitbang fallback that doesn't exist on RP2040).
; We set them explicitly here so the build doesn't depend on FastLED's
; default values (which have changed between 3.6.x and 3.10.x).

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
; CYW43 driver adds ~220 KB of firmware blob + ~40 KB of RAM (LWIP
; buffers). Together with the AsyncTCP/AsyncWebServer stack the pico2w
; build is much larger than a wired-only build would be.
;
; Flash layout: Pico 2 W has 4 MB total. Default reserves the full 4 MB
; for sketch (no FS partition). board_build.filesystem_size = 1MB tells
; maxgerhardt's builder/main.py (via board.get("build.filesystem_size"))
; to carve out a 1 MB LittleFS partition at the top of flash for
; /wifi.json + the embedded console-config JSON. See
; https://github.com/maxgerhardt/platform-raspberrypi/blob/master/builder/main.py#L40-L95
lib_deps =
        fastled/FastLED@^3.10.0
        mathertel/RotaryEncoder@^1.5.3
        evert-arias/EasyButton@^2.0.1
        z3t0/IRremote@^4.7.1
        bblanchon/ArduinoJson@^7.2.0
        ayushsharma82/RPAsyncTCP@^1.3.2
        esp32async/ESPAsyncWebServer@^3.7.2
        enjoyneering/LiquidCrystal_I2C@^1.4.0
build_flags =
        -D HAS_LEDS
        -D HAS_IR
        -D HAS_WIFI
        -D HAS_LCD
        -DARDUINO_ARCH_RP2040
        -DFASTLED_RP2040_CLOCKLESS_PIO=1
        -DFASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
		; Uncomment to silence warnings coming from third-party library headers
		; (IRremote's digitalWriteFast on a 64-pin LED_BUILTIN trips a shift-count
		; warning; ArduinoJson deprecates StaticJsonDocument). Left off by default
		; so real warnings stay visible.
		;-Wno-deprecated-declarations
		;-Wno-shift-count-overflow
build_src_filter = +<*> -<.git/> -<.pio/>
board_build.filesystem_size = 1MB

; Native test environment for the lib/ConsoleConfig functional core. Runs
; Unity tests on the host (no Arduino toolchain). Activated with:
;   pio test -d . -e test_native
[env:test_native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -std=c++11 -DARDUINOJSON_ENABLE_ARDUINO=0
test_filter = *

; Raspberry Pi Pico 2 W (RP2350A, dual-core ARM Cortex-M33, with
; on-board CYW43 WiFi/BLE). Pin map matches the original Pico (GP0..GP28
; + GP64 LED), plus the CYW43 WiFi/BLE pins on GP23..GP25. The board
; target defines ARDUINO_RASPBERRY_PI_PICO_2W + ARDUINO_ARCH_RP2040 +
; PICO_CYW43_SUPPORTED=1, so the firmware code under src/ works as-is.
; FastLED 3.10+ ships an rp2350 platform backend (the same code path
; as the rp2040 PIO driver; rp2350 has ARM cores so the bitbang path is
; viable, PIO is the default).
