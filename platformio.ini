; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 76800
upload_speed = 460800
lib_deps = 
	fastled/FastLED@^3.5.0
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	alanswx/ESPAsyncWiFiManager @ ^0.31
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	crankyoldgit/IRremoteESP8266@^2.8.5
build_flags =
	-D HAS_WIFI
	-D HAS_LEDS
	-Wno-misleading-indentation
	-Wno-deprecated-declarations

; Raspberry Pi Pico (RP2040) ports. No wireless on pico_base; picow adds
; HAS_WIFI via the build_flags so the network code (AsyncWebServer,
; ESPAsyncWiFiManager, WiFi.h, etc.) is compiled in.
[env:pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	fastled/FastLED@^3.5.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
; Tonight's pico_base scope: compile + link + boot, run the legacy
; consoleDefinitions() path, print to USB-CDC. LED ring (FastLED 3.10+ API
; needs real refactor) and IR driver (z3t0/IRremote@4.x swap) are excluded
; and land in follow-up commits. Same filter applied to picow below.
build_src_filter = +<*> -<.git/> -<.pio/> -<lighting.cpp> -<ircontrol.cpp> -<ircontrol.h>

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600

; build_flags = -D HAS_WIFI is intentionally NOT set: the network code path
; is gated on HAS_WIFI but pulls in ESP-specific libs (AsyncWebServer /
; WiFiManager) that we have on the nodemcuv2 env only. Re-enable HAS_WIFI
; once a CYW43 (Pico-W WiFi) implementation lands in network.{h,cpp} and
; its libs are added.

lib_deps =
	fastled/FastLED@^3.5.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
; Same scope as pico_base. pico_w builds the same firmware as pico for
; now; the board target differs so the .uf2 lands on the Pico-W variant.
build_src_filter = +<*> -<.git/> -<.pio/> -<lighting.cpp> -<ircontrol.cpp> -<ircontrol.h>
