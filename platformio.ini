; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ESP8266 (NodeMCU v2) support was dropped on session/merge-pico-json -- the
; legacy [env:nodemcuv2] block and the ESP-coupled libraries
; (ESPAsyncWebServer, ESPAsyncWiFiManager, crankyoldgit/IRremoteESP8266, etc.)
; are intentionally gone. We're targeting the Raspberry Pi Pico (RP2040) +
; Earle Philhower's arduino-pico core only. If a Pico-W WiFi implementation
; lands later (see TODO.md), AsyncWebServer + a CYW43 driver will be added
; back; the network.cpp / network.h files remain in the tree as the
; intended anchor for that work.

; Raspberry Pi Pico (RP2040) ports. No wireless on pico_base; picow adds
; HAS_WIFI via the build_flags so the network code (AsyncWebServer,
; WiFi.h, etc.) is compiled in.
;
; FastLED 3.10+ ships a complete RP2040 PIO backend at
; src/platforms/arm/rp2040/clockless_arm_rp2040.h. The backend is gated
; by FASTLED_RP2040_CLOCKLESS_PIO (=1, default) and
; FASTLED_RP2040_CLOCKLESS_M0_FALLBACK (=0, default; suppresses the
; legacy SysTick-using bitbang fallback that doesn't exist on RP2040).
; We set them explicitly here so the build doesn't depend on FastLED's
; default values (which have changed between 3.6.x and 3.10.x).
[env:pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	fastled/FastLED@^3.10.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-D HAS_LEDS
	-DARDUINO_ARCH_RP2040
	-DFASTLED_RP2040_CLOCKLESS_PIO=1
	-DFASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
; lighting.cpp is back in scope on Pico (FastLED compiles cleanly on RP2040
; with the build_flags above). ircontrol.{cpp,h} stay excluded until the
; z3t0/IRremote 4.x swap lands.
build_src_filter = +<*> -<.git/> -<.pio/> -<ircontrol.cpp> -<ircontrol.h>

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600

# build_flags = -D HAS_WIFI is intentionally NOT set: the network code path
# is gated on HAS_WIFI but pulls in ESP-specific libs (AsyncWebServer /
# WiFiManager) that we have on the nodemcuv2 env only. Re-enable HAS_WIFI
# once a CYW43 (Pico-W WiFi) implementation lands in network.{h,cpp} and
# its libs are added.

lib_deps =
	fastled/FastLED@^3.10.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-D HAS_LEDS
	-DARDUINO_ARCH_RP2040
	-DFASTLED_RP2040_CLOCKLESS_PIO=1
	-DFASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
# Same scope as pico_base. pico_w builds the same firmware as pico for
# now; the board target differs so the .uf2 lands on the Pico-W variant.
build_src_filter = +<*> -<.git/> -<.pio/> -<ircontrol.cpp> -<ircontrol.h>

; VCC-GND Studio YD-RP2040 dev board (the one currently on the desk).
; Distinct from pico_base in that:
;   - Board target = vccgnd_yd_rp2040 (defines ARDUINO_YD_RP2040 + the
;     variant's pin map). Onboard WS2812 on GP23, USR button on GP24.
;   - Same FastLED backend (3.10+ PIO driver) as pico_base.
;   - ircontrol.{cpp,h} excluded (same as the other Pico envs).
;
; Used to smoke-test FastLED 3.10+ PIO output against the onboard WS2812
; before the StackSelector perfboard lands. Build + flash with:
;   pio run -e pico_yd -t upload --upload-port /dev/cu.usbmodem11101
[env:pico_yd]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = vccgnd_yd_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	fastled/FastLED@^3.10.0
	mathertel/RotaryEncoder@^1.5.3
	evert-arias/EasyButton@^2.0.1
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-D HAS_LEDS
	-DFASTLED_RP2040_CLOCKLESS_PIO=1
	-DFASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
build_src_filter = +<*> -<.git/> -<.pio/> -<ircontrol.cpp> -<ircontrol.h>

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_speed = 921600
lib_deps =
        fastled/FastLED@^3.10.0
        mathertel/RotaryEncoder@^1.5.3
        evert-arias/EasyButton@^2.0.1
        z3t0/IRremote@^4.7.1
        bblanchon/ArduinoJson@^7.2.0
build_flags =
        -D HAS_LEDS
        -D HAS_IR
        -DARDUINO_ARCH_RP2040
        -DFASTLED_RP2040_CLOCKLESS_PIO=1
        -DFASTLED_RP2040_CLOCKLESS_M0_FALLBACK=0
build_src_filter = +<*> -<.git/> -<.pio/>
; See todo/open/2026-09-21_pico-2-w-platform.md for the WiFi + webserver plan.

; Native test environment for the lib/ConsoleConfig functional core. Runs
; Unity tests on the host (no Arduino toolchain). Activated with:
;   pio test -d . -e test_native
[env:test_native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -std=c++11 -DARDUINOJSON_ENABLE_ARDUINO=0
test_filter = *

; Raspberry Pi Pico 2 W (RP2350A, dual-core ARM Cortex-M33, with
; on-board CYW43 WiFi/BLE). Same pin map as the Pico (0..28 + GP64 LED).
; The board target defines ARDUINO_RASPBERRY_PI_PICO_2W + ARDUINO_ARCH_RP2040
; + PICO_CYW43_SUPPORTED=1, so the firmware code under src/ works as-is.
; FastLED 3.10+ ships an rp2350 platform backend (the same code path
; as the rp2040 PIO driver; rp2350 has ARM cores so the bitbang path is
; viable, PIO is the default).
