<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:420px;margin:3em auto;padding:0 1em;color:rgb(34,34,34);line-height:1.4}

<body>
<h2>Factory reset?</h2>
<p>This will erase the saved console configuration, the saved WiFi

  <input type="hidden" name="nonce" value="__NONCE__">
  <button type="submit" class="yes">Yes, erase and reboot</button>
